<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SG Educational Course Recommender</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>🎓 SG Educational Course Recommender</h1>
      <p class="sub">
        Find courses using keywords + filters.
        <span
          class="hint"
          title="Scores are relative similarity for this search run (not accuracy)."
        >
          Match score is relative similarity, not accuracy.
        </span>
      </p>

      <div class="row">
        <select id="institutionType"></select>
        <select id="level"></select>
        <select id="institution"></select>
      </div>

      <div class="row toggles">
        <label class="toggle">
          <input type="checkbox" id="requiresMath" />
          Requires Math
        </label>

        <label class="toggle">
          <input type="checkbox" id="requiresEnglish" />
          Requires English
        </label>
      </div>

      <div class="row toggles">
        <label class="toggle">
          <input type="checkbox" id="useSemantic" />
          Semantic search
        </label>

        <label class="toggle">
          <input type="checkbox" id="useHybrid" disabled />
          Hybrid (semantic + keywords)
        </label>
      </div>

      <div class="row">
        <input
          id="query"
          placeholder="Keywords (e.g., cybersecurity, data analytics, business, design)"
        />
        <button id="btn">🔎 Find My Courses</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- ✅ My Saved Courses only -->
      <div class="row">
        <button id="btnSaved" type="button">⭐ My Saved Courses</button>
      </div>

      <!-- ✅ Saved-only view -->
      <div id="savedPanel" class="savedPanel" style="display: none"></div>

      <!-- ✅ Compare bar (search view only; JS hides it in saved view) -->
      <div id="compareBar" class="compareBar" style="display: none">
        <div>
          <strong>Compare:</strong>
          <span id="compareCount">0</span> selected (max 3)
        </div>
        <div class="compareActions">
          <button id="btnCompare">Compare now</button>
          <button id="btnClearCompare">Clear</button>
        </div>
      </div>

      <div id="comparePanel" class="comparePanel" style="display: none"></div>

      <!-- Search results -->
      <div id="results"></div>
    </div>

    <script src="app.js?v=5"></script>
  </body>
</html>
